default_experiment: Test

runs:
  invocations: 2

benchmark_suites:
    Suite:
        gauge_adapter: Multivariate
        command: TestBenchMarks %(benchmark)s
        env:
            LUA_PATH: "?.lua;../../awfy/Lua/?.lua"
            TEST: just a string
            A_NUMBER: '42'
        benchmarks:
            - Bench1

executors:
    TestRunner1:
        path: .
        executable: as_user_vm.py

experiments:
    Test:
        suites:
         - Suite
        executions:
         - TestRunner1
